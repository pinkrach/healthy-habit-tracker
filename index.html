<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Habits" />
    <meta name="theme-color" content="#F3F8F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1612" media="(prefers-color-scheme: dark)" />
    <title>Healthy Habit Tracker</title>
    <meta
      name="description"
      content="A 4-week tracker for stacking healthy eating habits, starting October 10, 2026."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="screens">
        <section class="screen is-active" id="screen-home" aria-labelledby="home-title">
          <header class="screen-head">
            <h1 id="home-title">Saturday</h1>
            <p id="home-date">October 10</p>
            <p id="home-status">Starts in 3 days</p>
          </header>

          <section class="card streak" aria-labelledby="streak-label">
            <div class="streak-main">
              <p class="streak-count" id="streak-count">0</p>
              <p class="streak-label" id="streak-label">day streak</p>
            </div>
            <div class="streak-days">
              <p><span id="days-passed">0</span> passed</p>
              <p><span id="days-left">28</span> left</p>
            </div>
            <p class="footnote" id="streak-note"></p>
          </section>

          <section class="card" aria-labelledby="home-habits-title">
            <div class="card-head">
              <h2 id="home-habits-title">Today</h2>
              <p id="home-score">0 of 1</p>
            </div>
            <div id="home-habits"></div>
            <label class="note">
              <span>Note</span>
              <textarea id="home-note" rows="2" maxlength="240" placeholder="Add a note for this day"></textarea>
            </label>
          </section>

          <button type="button" id="reset-btn" class="text-btn">Reset progress</button>
        </section>

        <section class="screen" id="screen-calendar" aria-labelledby="calendar-title" hidden>
          <header class="screen-head calendar-head">
            <button type="button" id="prev-month" class="chevron" aria-label="Previous month">
              <svg viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8" /></svg>
            </button>
            <div>
              <h1 id="calendar-title">October</h1>
              <p id="calendar-year">2026</p>
            </div>
            <button type="button" id="next-month" class="chevron" aria-label="Next month">
              <svg viewBox="0 0 12 20" aria-hidden="true"><path d="M2 2 10 10l-8 8" /></svg>
            </button>
          </header>

          <section class="card calendar-card">
            <div class="weekday-row" aria-hidden="true">
              <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
            </div>
            <div id="calendar-grid" class="calendar-grid" role="grid" aria-label="Plan calendar"></div>
            <p class="footnote legend"><span class="legend-dot"></span> Green marks a finished day</p>
          </section>

          <section class="card" id="calendar-day" hidden>
            <div class="card-head">
              <h2 id="calendar-day-title">Saturday</h2>
              <p id="calendar-score">0 of 1</p>
            </div>
            <div id="calendar-habits"></div>
            <label class="note">
              <span>Note</span>
              <textarea id="calendar-note" rows="2" maxlength="240" placeholder="Add a note for this day"></textarea>
            </label>
          </section>
        </section>

        <section class="screen" id="screen-goals" aria-labelledby="goals-title" hidden>
          <header class="screen-head">
            <h1 id="goals-title">Goals</h1>
            <p>5 of 7 days for each habit</p>
          </header>
          <div id="goal-weeks"></div>
        </section>
      </div>

      <nav class="tabbar" aria-label="Sections">
        <button type="button" class="tab" id="tab-home" data-tab="home" aria-selected="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 10.8 12 4.5l7.5 6.3V19a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H6A1.5 1.5 0 0 1 4.5 19v-8.2z" /></svg>
          <span>Home</span>
        </button>
        <button type="button" class="tab" id="tab-calendar" data-tab="calendar" aria-selected="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="2" /><path d="M8 3.5v4M16 3.5v4M4 10h16" /></svg>
          <span>Calendar</span>
        </button>
        <button type="button" class="tab" id="tab-goals" data-tab="goals" aria-selected="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" /><circle cx="12" cy="12" r="3.5" /><circle cx="12" cy="12" r="1" /></svg>
          <span>Goals</span>
        </button>
      </nav>
    </div>

    <dialog id="reset-dialog" aria-labelledby="reset-title">
      <h2 id="reset-title">Reset progress?</h2>
      <p>This clears every checkmark and note on this device. You can’t undo it.</p>
      <form method="dialog" class="dialog-actions">
        <button value="cancel">Cancel</button>
        <button value="reset">Reset</button>
      </form>
    </dialog>

    <canvas id="confetti" aria-hidden="true"></canvas>
    <noscript>
      <p class="noscript">Turn on JavaScript to use the habit tracker.</p>
    </noscript>
    <script src="app.js"></script>
  </body>
</html>
